# Mints a GitHub App installation token from an App id and private key kept in AWS SSM
# Parameter Store, read through an OIDC role.
#
# Everything account-specific is an input: pass the role from a secret, ideally an
# environment secret whose environment admits only the branches that may mint the
# token. The role should read the two parameters and nothing else.
#
# The calling job needs `permissions: id-token: write`.
name: GitHub App token from SSM
description: Mints a GitHub App installation token from credentials in AWS SSM Parameter Store.

inputs:
  aws-role:
    description: ARN of the IAM role to assume through OIDC. Pass it from a secret.
    required: true
  aws-region:
    description: Region of the SSM parameters.
    required: true
  app-id-parameter:
    description: Name of the SSM parameter holding the App id.
    required: true
  private-key-parameter:
    description: Name of the SecureString SSM parameter holding the App's private key (PEM).
    required: true
  repositories:
    description: Repositories the token may touch, comma or newline separated. Empty means the calling repository only.
    required: false
    default: ""

outputs:
  token:
    description: The App installation token. It expires after an hour.
    value: ${{ steps.token.outputs.token }}
  app-slug:
    description: The App's slug, for a commit author or a bot login.
    value: ${{ steps.token.outputs.app-slug }}

runs:
  using: composite
  steps:
    # GitHub-hosted runners have it; many self-hosted runner images do not.
    - name: Install AWS CLI
      shell: bash
      run: |
        if ! command -v aws >/dev/null 2>&1; then
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscliv2.zip"
          (cd "$RUNNER_TEMP" && unzip -q awscliv2.zip && sudo ./aws/install)
        fi

    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Read App credentials
      id: creds
      shell: bash
      env:
        APP_ID_PARAMETER: ${{ inputs.app-id-parameter }}
        PRIVATE_KEY_PARAMETER: ${{ inputs.private-key-parameter }}
      run: |
        set -euo pipefail
        app_id=$(aws ssm get-parameter --name "$APP_ID_PARAMETER" --query 'Parameter.Value' --output text)
        private_key=$(aws ssm get-parameter --name "$PRIVATE_KEY_PARAMETER" --with-decryption \
          --query 'Parameter.Value' --output text)
        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done <<< "$private_key"
        # A step output, not GITHUB_ENV: the key must not reach the caller's later steps.
        delim="EOF_${RANDOM}_${RANDOM}"
        {
          echo "app-id=$app_id"
          echo "private-key<<$delim"
          echo "$private_key"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        # The role is needed only for the read above.
        {
          echo "AWS_ACCESS_KEY_ID="
          echo "AWS_SECRET_ACCESS_KEY="
          echo "AWS_SESSION_TOKEN="
        } >> "$GITHUB_ENV"

    - uses: actions/create-github-app-token@v3
      id: token
      with:
        app-id: ${{ steps.creds.outputs.app-id }}
        private-key: ${{ steps.creds.outputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repositories || github.event.repository.name }}
