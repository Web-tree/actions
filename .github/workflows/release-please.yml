# Runs release-please as a GitHub App, so the release PR it opens or updates gets its
# pull_request checks with no "Approve workflows to run", and the tag it makes starts
# the caller's `push: tags` workflows. A GITHUB_TOKEN push does neither.
#
# The App's credentials come from secrets of the job's environment (`environment`,
# default `release`). Give that environment a deployment branch policy that admits
# only the release branch, so no other branch or fork PR can read them. Either:
#   APP_ID + APP_PRIVATE_KEY   the App's id and private key, or
#   AWS_ROLE                   an OIDC role that reads them from SSM Parameter Store
#                              (inputs app-id-parameter, private-key-parameter, aws-region).
#
# Caller, on push to the release branch:
#
#   jobs:
#     release-please:
#       permissions:
#         id-token: write       # AWS_ROLE only
#         checks: read          # auto-merge reads the release PR's required checks
#         pull-requests: read
#       uses: Web-tree/actions/.github/workflows/release-please.yml@v1
#       with:
#         auto-merge: true      # every release PR merges itself once its required checks pass
#       secrets: inherit        # environment secrets reach the called job only this way
name: release-please

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
      target-branch:
        description: Branch release-please releases from. Empty means the repository's default branch.
        type: string
        default: ""
      runs-on:
        type: string
        default: ubuntu-latest
      auto-merge:
        description: Merge each open release PR once its required checks pass, so every releasable change is released.
        type: boolean
        default: false
      merge-method:
        description: MERGE, SQUASH or REBASE, for auto-merge.
        type: string
        default: SQUASH
      environment:
        description: Environment whose secrets hold the App's credentials.
        type: string
        default: release
      aws-region:
        description: Region of the SSM parameters (AWS_ROLE only).
        type: string
        default: ""
      app-id-parameter:
        description: SSM parameter holding the App id (AWS_ROLE only).
        type: string
        default: ""
      private-key-parameter:
        description: SSM parameter holding the App's private key (AWS_ROLE only).
        type: string
        default: ""
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      AWS_ROLE:
        required: false
    outputs:
      release_created:
        description: "'true' when this run made the release of the root package"
        value: ${{ jobs.release-please.outputs.release_created }}
      releases_created:
        description: "'true' when this run made any release"
        value: ${{ jobs.release-please.outputs.releases_created }}
      tag_name:
        description: Tag of the root package's release
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of the root package's release
        value: ${{ jobs.release-please.outputs.version }}
      paths_released:
        description: JSON array of the package paths released
        value: ${{ jobs.release-please.outputs.paths_released }}
      prs_created:
        description: "'true' when this run opened or updated a release PR"
        value: ${{ jobs.release-please.outputs.prs_created }}
      pr:
        description: JSON of the release PR
        value: ${{ jobs.release-please.outputs.pr }}
      outputs:
        description: All of release-please's outputs as one JSON object, for per-package keys of a monorepo
        value: ${{ jobs.release-please.outputs.outputs }}

permissions: {}

jobs:
  release-please:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    # Never cancelled: a later run finds a merged release PR this one skipped and releases it.
    concurrency:
      group: release-please-${{ github.repository }}
    permissions:
      id-token: write
      checks: read
      pull-requests: read
    env:
      # `if:` cannot read secrets.
      CREDENTIALS: ${{ secrets.APP_PRIVATE_KEY != '' && 'secrets' || secrets.AWS_ROLE != '' && 'ssm' || '' }}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
      outputs: ${{ toJSON(steps.rp.outputs) }}
    steps:
      - name: Require App credentials
        if: env.CREDENTIALS == ''
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "::error::environment '$ENVIRONMENT' has neither APP_ID + APP_PRIVATE_KEY nor AWS_ROLE, or the caller does not pass 'secrets: inherit'"
          exit 1
      - if: env.CREDENTIALS == 'secrets'
        uses: actions/create-github-app-token@v3
        id: app-secrets
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - if: env.CREDENTIALS == 'ssm'
        uses: Web-tree/actions/app-token-from-ssm@v1
        id: app-ssm
        with:
          aws-role: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ inputs.aws-region }}
          app-id-parameter: ${{ inputs.app-id-parameter }}
          private-key-parameter: ${{ inputs.private-key-parameter }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-secrets.outputs.token || steps.app-ssm.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

      # GitHub's auto-merge, not a direct merge: it waits for the branch's required checks
      # and reviews, which an App that bypasses rulesets would otherwise skip. Every open
      # release PR, not only one this run touched: release-please reports nothing for a PR
      # it left unchanged.
      - name: Auto-merge release PRs
        if: inputs.auto-merge
        env:
          GH_TOKEN: ${{ steps.app-secrets.outputs.token || steps.app-ssm.outputs.token }}
          # The App needs no checks permission: GITHUB_TOKEN reads them.
          CHECKS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.target-branch || github.event.repository.default_branch }}
          METHOD: ${{ inputs.merge-method }}
        run: |
          set -euo pipefail
          case "$METHOD" in MERGE|SQUASH|REBASE) ;; *) echo "::error::merge-method must be MERGE, SQUASH or REBASE, got '$METHOD'"; exit 1 ;; esac
          prs=$(gh pr list --repo "$REPO" --state open --base "$BASE" --label 'autorelease: pending' \
            --json id,number,headRefName,isCrossRepository,autoMergeRequest \
            --jq '.[] | select((.headRefName | startswith("release-please--")) and (.isCrossRepository | not) and .autoMergeRequest == null) | "\(.number) \(.id)"')
          while read -r pr id; do
            [ -n "$pr" ] || continue
            # shellcheck disable=SC2016  # $id and $method are GraphQL variables
            if out=$(gh api graphql -f id="$id" -f method="$METHOD" -f query='
              mutation($id: ID!, $method: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: $method}) { clientMutationId }
              }' 2>&1); then
              echo "#$pr: auto-merge on"
              continue
            fi
            echo "$out"
            # GitHub refuses auto-merge on a PR that can merge already: merge it now, once its
            # required checks have passed, pinned to the head they passed on.
            grep -qE '(clean|unstable) status' <<< "$out" || exit 1
            head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
            if ! checks=$(GH_TOKEN="$CHECKS_TOKEN" gh pr checks "$pr" --repo "$REPO" --required 2>&1); then
              grep -q 'no required checks' <<< "$checks" || { echo "$checks"; exit 1; }
            fi
            gh pr merge "$pr" --repo "$REPO" "--$(tr '[:upper:]' '[:lower:]' <<< "$METHOD")" --match-head-commit "$head"
            echo "#$pr: merged"
          done <<< "$prs"
